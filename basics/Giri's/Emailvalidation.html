<!-- Example4: WAP to create one textbox and perform email validations
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>email validation</title>
    <script>
        function checkMail(mail){
            if(!(mail.includes("@")) || !(mail.includes("."))){
                document.getElementById("head").textContent = "Not A Valid mail";
            }
            else{
                 document.getElementById("head").textContent = "A Valid mail";
            }
        }
    </script>
</head>
<body>
    <input type="text" name="" id="inputs" onkeyup="checkMail(this.value)">
    <div>
        <h3 id ="head"></h3>
    </div>
</body>
</html>
