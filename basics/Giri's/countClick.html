<!-- 6. Count Button Clicks -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count click</title>
    <script>
        let count = 0;
        function counter(){
            ++count;
           document.getElementById("button").value= count;
           document.getElementById("button").style.width = "100px";

        }
    </script>
 </head>
 <body>
    <input type="button" name="btn" id="button" value = "click" onclick="counter()" style="width: 100px;">
 </body>
 </html>
