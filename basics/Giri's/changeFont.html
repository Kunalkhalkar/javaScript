<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change the Font size</title>
    <script>
        let font = 20;
        function decrease(){
            font -=2;
            document.getElementById("text").style.fontSize = font +"px";
        }
        function increase(){
            font +=2;
            document.getElementById("text").style.fontSize = font + "px";
        }
    </script>
</head>
<body>
    <div >
        <button id = "buttonSub" onclick="decrease()">
            -
        </button>
        <h1 id="text" style="font-size: 20px;">
            hello I can change size
        </h1>
        <button id = "buttonAdd" onclick="increase()">
            +
        </button>
    </div>
</body>
</html>
