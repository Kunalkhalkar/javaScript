<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change the color</title>
    <script>
        function changeColor(){
            let h1= document.getElementById("h1");
            h1.style.color = "red";
        }
    </script>
</head>
<body>
    <h1 id ="h1">Hello I Am JavaScript</h1>
    <input type="submit" name="" id="submit" value="Change color" onclick="changeColor()">
</body>
</html>
