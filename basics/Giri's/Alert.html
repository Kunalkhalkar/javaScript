<!-- 10. Alert Input Value
Description: Show alert with entered text.
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function showText(){
            alert(document.getElementById("text").value);
        }
    </script>
</head>
<body>
    <input type="text" name="text" id="text" placeholder="text">
    <button onclick="showText()">
        show
    </button>
</body>
</html>
